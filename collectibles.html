<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');

  :root {
    --gold: #c8a84b;
    --gold-light: #e8c96a;
    --gold-dim: #7a6228;
    --blood: #8b1a1a;
    --blood-dark: #5a0f0f;
    --umbral: #2a1a3e;
    --umbral-mid: #3d2a5a;
    --umbral-light: #6b4e9c;
    --surface: #12100e;
    --surface-2: #1a1714;
    --surface-3: #221f1c;
    --surface-4: #2d2925;
    --text: #e8e0d0;
    --text-muted: #9a8e7a;
    --text-dim: #5a5248;
    --silver: #b0b8c8;
    --bronze: #c8834b;
    --platinum: #e0e8f0;
    --green: #4a8a5a;
    --green-light: #6ab87e;
    --border: rgba(200,168,75,0.18);
    --border-light: rgba(200,168,75,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Crimson Pro', Georgia, serif;
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
  }

  .header {
    background: linear-gradient(180deg, #0a0806 0%, var(--surface) 100%);
    border-bottom: 1px solid var(--border-light);
    padding: 1.5rem 1.5rem 1rem;
    text-align: center;
  }

  .header h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--gold);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.3rem;
  }

  .header .subtitle {
    font-size: 0.9rem;
    color: var(--text-muted);
  }

  .back-link {
    display: inline-block;
    margin-top: 0.5rem;
    color: var(--gold);
    text-decoration: none;
    font-size: 0.85rem;
  }
  .back-link:hover { color: var(--gold-light); }

  .progress-section {
    background: var(--surface-2);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .progress-stats {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }

  .progress-label {
    font-family: 'Cinzel', serif;
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .progress-count {
    font-family: 'Cinzel', serif;
    font-size: 0.85rem;
    color: var(--gold);
    font-weight: 600;
  }

  .progress-pct {
    font-family: 'Cinzel', serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--gold-light);
  }

  .progress-bar-bg {
    height: 6px;
    background: var(--surface-4);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--gold-light));
    border-radius: 3px;
    transition: width 0.3s ease;
  }

  .category-tabs {
    display: flex;
    gap: 0.5rem;
    margin-top: 0.75rem;
    flex-wrap: wrap;
  }

  .cat-tab {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.35rem 0.6rem;
    border-radius: 3px;
    background: var(--surface-3);
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.2s;
  }

  .cat-tab:hover, .cat-tab.active {
    background: var(--gold-dim);
    color: var(--text);
    border-color: var(--gold);
  }

  .main {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem 1rem 4rem;
  }

  .area {
    margin-bottom: 1.5rem;
  }

  .area-header {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1rem;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px 5px 0 0;
    cursor: pointer;
    user-select: none;
  }

  .area-header:hover { background: var(--surface-3); }

  .area-num {
    font-family: 'Cinzel', serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--gold-dim);
    background: rgba(200,168,75,0.1);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 0.1rem 0.4rem;
  }

  .area-title {
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--gold-light);
    flex: 1;
  }

  .area-progress {
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .area-chevron {
    font-size: 0.65rem;
    color: var(--text-dim);
    transition: transform 0.25s;
  }

  .area.collapsed .area-chevron { transform: rotate(-90deg); }

  .area-body {
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 5px 5px;
    overflow: hidden;
  }

  .area.collapsed .area-body { display: none; }

  .item {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    padding: 0.5rem 1rem;
    background: var(--surface-2);
    border-bottom: 1px solid rgba(200,168,75,0.05);
    transition: background 0.15s;
    cursor: pointer;
  }

  .item:hover { background: var(--surface-3); }
  .item.checked { background: rgba(74,138,90,0.08); }

  .item-check {
    width: 16px;
    height: 16px;
    border-radius: 3px;
    border: 1.5px solid var(--text-dim);
    background: transparent;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
    pointer-events: none;
  }

  .item.checked .item-check {
    background: var(--green);
    border-color: var(--green);
  }

  .check-svg { display: none; width: 9px; height: 9px; }
  .item.checked .check-svg { display: block; }

  .item-name {
    font-size: 0.85rem;
    color: var(--text);
    flex: 1;
    min-width: 0;
  }

  .item.checked .item-name {
    color: var(--text-dim);
    text-decoration: line-through;
    text-decoration-color: var(--text-dim);
  }

  .item-type {
    font-family: 'Cinzel', serif;
    font-size: 0.5rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.15rem 0.4rem;
    border-radius: 2px;
    background: var(--surface-3);
    color: var(--text-muted);
    white-space: nowrap;
  }

  .item-type.trophy { background: rgba(200,131,75,0.2); color: var(--bronze); }
  .item-type.weapon { background: rgba(139,26,26,0.2); color: #e07070; }
  .item-type.armor { background: rgba(107,78,156,0.2); color: #b08eea; }
  .item-type.ring { background: rgba(74,138,90,0.2); color: var(--green-light); }
  .item-type.pendant { background: rgba(74,138,90,0.2); color: var(--green-light); }
  .item-type.spell { background: rgba(200,168,75,0.15); color: var(--gold); }
  .item-type.ammo { background: rgba(176,184,200,0.15); color: var(--silver); }
  .item-type.stigma { background: rgba(42,26,62,0.4); color: var(--umbral-light); }
  .item-type.eye { background: rgba(42,26,62,0.4); color: var(--umbral-light); }
  .item-type.gesture { background: rgba(176,184,200,0.15); color: var(--silver); }
  .item-type.npc { background: rgba(200,168,75,0.15); color: var(--gold); }
  .item-type.boss { background: rgba(139,26,26,0.3); color: #e06060; }
  .item-type.upgrade { background: rgba(200,131,75,0.2); color: #e8a060; }
  .item-type.collectible { background: var(--surface-3); color: var(--text-muted); }

  .item.missable > .item-name::after {
    content: ' ⚠';
    color: #e06060;
    font-size: 0.75rem;
  }

  .tips-section {
    margin: 1rem;
    padding: 0.75rem 1rem;
    background: rgba(200,168,75,0.06);
    border-left: 3px solid var(--gold-dim);
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .tips-section strong { color: var(--gold); }

  @media (max-width: 600px) {
    .main { padding: 0.75rem 0.5rem 4rem; }
    .category-tabs { gap: 0.35rem; }
    .cat-tab { font-size: 0.55rem; padding: 0.25rem 0.45rem; }
  }
</style>

// ============ CURRENT FILTER ============
let currentFilter = 'all';

// ============ INITIALIZE ============
function init() {
  renderCollectibles();
  updateStats();
}

// ============ RENDER COLLECTIBLES ============
function renderCollectibles() {
  const container = document.getElementById('collectibles-list');
  container.innerHTML = '';
  
  const areas = [...new Set(collectibles.map(c => c.area))];
  
  areas.forEach((areaId, index) => {
    const areaItems = collectibles.filter(c => c.area === areaId);
    const checkedCount = areaItems.filter(i => isChecked(i.id)).length;
    
    const areaDiv = document.createElement('div');
    areaDiv.className = 'area';
    areaDiv.innerHTML = `
      <div class="area-header" onclick="toggleArea(this)">
        <span class="area-num">${index + 1}</span>
        <span class="area-title">${areaNames[areaId] || areaId}</span>
        <span class="area-progress">${checkedCount}/${areaItems.length}</span>
        <span class="area-chevron">▼</span>
      </div>
      <div class="area-body">
        ${areaItems.map(item => renderItem(item)).join('')}
      </div>
    `;
    
    container.appendChild(areaDiv);
  });
  
  // Apply current filter
  applyFilter();
}

function renderItem(item) {
  const checked = isChecked(item.id);
  const hidden = currentFilter !== 'all' && getItemCategory(item.type) !== currentFilter;
  
  return `
    <div class="item ${checked ? 'checked' : ''} ${item.missable ? 'missable' : ''}" 
         data-id="${item.id}" 
         data-type="${item.type}"
         style="display: ${hidden ? 'none' : 'flex'}"
         onclick="toggleItem('${item.id}')">
      <div class="item-check">
        <svg class="check-svg" viewBox="0 0 10 10"><polyline points="1.5,5 4,7.5 8.5,2" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="item-name">${item.name}</span>
      <span class="item-type ${item.type}">${item.type}</span>
    </div>
  `;
}

// ============ TOGGLE FUNCTIONS ============
function toggleArea(header) {
  const area = header.parentElement;
  area.classList.toggle('collapsed');
}

function toggleItem(id) {
  const key = 'lotf-coll-' + id;
  const current = localStorage.getItem(key) === 'true';
  localStorage.setItem(key, !current);
  
  renderCollectibles();
  updateStats();
  syncWithMainPage();
}

function isChecked(id) {
  return localStorage.getItem('lotf-coll-' + id) === 'true';
}

// ============ FILTERING ============
function filterCategory(cat) {
  currentFilter = cat;
  
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.classList.remove('active');
  });
  event.target.classList.add('active');
  
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('.item').forEach(item => {
    const type = item.dataset.type;
    const cat = getItemCategory(type);
    item.style.display = (currentFilter === 'all' || cat === currentFilter) ? 'flex' : 'none';
  });
}

function getItemCategory(type) {
  const map = {
    'weapon': 'weapon',
    'armor': 'armor',
    'ring': 'ring',
    'pendant': 'pendant',
    'spell': 'spell',
    'ammo': 'ammo',
    'stigma': 'stigma',
    'eye': 'eye',
    'gesture': 'gesture',
    'trophy': 'trophy',
    'npc': 'npc',
    'boss': 'boss',
    'upgrade': 'upgrade',
    'collectible': 'collectible'
  };
  return map[type] || 'other';
}

// ============ STATS ============
function updateStats() {
  const total = collectibles.length;
  const checked = collectibles.filter(i => isChecked(i.id)).length;
  const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
  
  document.getElementById('total-count').textContent = `${checked} / ${total} items`;
  document.getElementById('total-pct').textContent = `${pct}%`;
  document.getElementById('main-bar').style.width = `${pct}%`;
  
  // Update category counts
  const categories = ['weapon', 'armor', 'ring', 'pendant', 'spell', 'ammo', 'stigma', 'eye', 'gesture', 'trophy'];
  categories.forEach(cat => {
    const items = collectibles.filter(i => getItemCategory(i.type) === cat);
    const count = items.filter(i => isChecked(i.id)).length;
    const btn = document.querySelector(`button[onclick="filterCategory('${cat}')"]`);
    if (btn) {
      btn.textContent = `${cat.charAt(0).toUpperCase() + cat.slice(1)} (${count})`;
    }
  });
}

// ============ SYNC WITH MAIN PAGE ============
function syncWithMainPage() {
  // Count by category
  const counts = {};
  collectibles.forEach(item => {
    const cat = getItemCategory(item.type);
    counts[cat] = (counts[cat] || 0) + (isChecked(item.id) ? 1 : 0);
  });
  
  // Store for main page to read
  localStorage.setItem('lotf-collectibles-stats', JSON.stringify(counts));
}

// Initialize on load
init();
</script>

</body>
</html>
